name: Heller-Einstein PFK Dependency Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Heller-Einstein
        uses: actions/checkout@v4
        with:
          path: Heller-Einstein

      - name: Checkout Heller-Godel at pinned commit
        uses: actions/checkout@v4
        with:
          repository: SocioProphet/Heller-Godel
          ref: 988307215ad38ccb16514311222184a1b757752b
          path: Heller-Godel

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run tests
        env:
          HELLER_GODEL_ROOT: ${{ github.workspace }}/Heller-Godel
        run: |
          cd Heller-Einstein
          python -m unittest tests/test_pfk_dependency.py -v
